name: prepared-data-pipeline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,data,lab,ecosystem,browser]'
      - run: python -m pytest tests/test_pipeline.py -q
      - run: python scripts/pipeline-test.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/pipeline-browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-data-pipeline-check
          path: |
            outputs/pipeline/
            outputs/pipeline-browser/
