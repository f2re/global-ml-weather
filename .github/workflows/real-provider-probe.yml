name: real-provider-probe
on:
  workflow_dispatch:
  push:
    branches: ['feature/real-data-training-v070']
    paths: ['scripts/probe-real-providers.py', '.github/workflows/real-provider-probe.yml']
permissions:
  contents: read
jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy xarray scipy h5netcdf netCDF4
      - run: python scripts/probe-real-providers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-public-provider-files
          path: outputs/provider-probe
          if-no-files-found: error
          retention-days: 30
