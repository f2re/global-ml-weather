name: materialize-architecture-images

on:
  push:
    branches:
      - feature/architecture-visual-guide

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-images]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images/architecture
          unzip -q .image-staging/architecture-images-webp.zip -d docs/images/architecture
          cd docs/images/architecture
          echo "714c4808a83f4f7e9f81d3281158dc62a8e295c1e1c59e256a7b5c8e2f241ff1  01-global-architecture-overview.webp" | sha256sum -c -
          echo "0235fcc7883d2d5105d84f0d6f70109fa9a2cf76e10d3724f42042b2788db8b8  02-input-data-and-feature-preparation.webp" | sha256sum -c -
          echo "62d0cea342bee37d9d6131a6b473dcbfabaaf2b53ba7bc2e8cae29c01a06f5fd  03-satellite-spatiotemporal-encoder.webp" | sha256sum -c -
          echo "f7e89e9409b627523f57b338462adea1e77bcc71bae10388ecf6e95f0e7fafca  04-sparse-observation-encoder.webp" | sha256sum -c -
          echo "01e220ff32aae871d9a5bd314c51456e47f10a4747139677da4a8b82fae18d8c  05-feature-fusion-and-compressed-vertical.webp" | sha256sum -c -
          echo "19824ffc9ce97cf1e9a9c5e7f3b96bf0c5786081a4886bfab8a0dbae03567dda  06-global-adaptive-forecast-core.webp" | sha256sum -c -
          echo "9d4fec02c1f20d1953ef9e3fc4fd249c1eabdd08198bc586a23b749a1dcc37ed  07-decoder-and-output-heads.webp" | sha256sum -c -
          echo "d952815dbbf07d73ca444f11c1ba41d45805ad54c9636d1e4b693fdd7ccfc467  08-full-training-analysis-and-forecast-flow.webp" | sha256sum -c -
      - name: Commit materialized images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/architecture
          git commit -m "docs: materialize architecture images [materialized-images]"
          git push
