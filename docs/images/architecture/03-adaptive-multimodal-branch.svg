<text x="469" y="497" font-size="20" font-weight="400" fill="#6f42c1" text-anchor="start">attention compression</text>
<circle cx="454" cy="519" r="4" fill="#6f42c1"/>
<text x="469" y="526" font-size="20" font-weight="400" fill="#6f42c1" text-anchor="start">K=8 latent slots</text>
<defs><marker id="m47" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f42c1"/></marker></defs>
<line x1="750" y1="420" x2="815" y2="420" stroke="#6f42c1" stroke-width="5" marker-end="url(#m47)"/>
<rect x="815" y="220" width="320" height="210" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="833" y="254" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Multiscale graph</text>
<circle cx="839" cy="281" r="4" fill="#1677d2"/>
<text x="854" y="288" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">directed exchange</text>
<circle cx="839" cy="310" r="4" fill="#1677d2"/>
<text x="854" y="317" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">area-weighted down/up</text>
<circle cx="839" cy="339" r="4" fill="#1677d2"/>
<text x="854" y="346" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">local / vertical / graph mixing</text>
<circle cx="839" cy="368" r="4" fill="#1677d2"/>
<text x="854" y="375" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">state-conditioned gates</text>
<rect x="815" y="460" width="320" height="130" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="833" y="494" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Forecast step</text>
<circle cx="839" cy="521" r="4" fill="#1677d2"/>
<text x="854" y="528" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">3 часа</text>
<circle cx="839" cy="550" r="4" fill="#1677d2"/>
<text x="854" y="557" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">до 72 ч в Adaptive-контуре</text>
<defs><marker id="m65" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1677d2"/></marker></defs>
<line x1="1135" y1="420" x2="1200" y2="420" stroke="#1677d2" stroke-width="5" marker-end="url(#m65)"/>
