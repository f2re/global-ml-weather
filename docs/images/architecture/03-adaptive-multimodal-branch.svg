<text x="1218" y="254" font-size="24" font-weight="700" fill="#6f42c1" text-anchor="start">Attention expansion</text>
<circle cx="1224" cy="281" r="4" fill="#6f42c1"/>
<text x="1239" y="288" font-size="20" font-weight="400" fill="#6f42c1" text-anchor="start">K=8 → физическая вертикаль</text>
<circle cx="1224" cy="310" r="4" fill="#6f42c1"/>
<text x="1239" y="317" font-size="20" font-weight="400" fill="#6f42c1" text-anchor="start">decoder heads</text>
<rect x="1200" y="400" width="335" height="190" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="1218" y="434" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Outputs</text>
<circle cx="1224" cy="461" r="4" fill="#1677d2"/>
<text x="1239" y="468" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">37 levels: T,q,u,v,Φ,ω</text>
<circle cx="1224" cy="490" r="4" fill="#1677d2"/>
<text x="1239" y="497" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">surface fields</text>
<circle cx="1224" cy="519" r="4" fill="#1677d2"/>
<text x="1239" y="526" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">product masks</text>
<rect x="45" y="650" width="1490" height="105" rx="18" fill="#f7fafc" stroke="#bdd7ef" stroke-width="2"/>
<text x="790" y="690" font-size="25" font-weight="700" fill="#0b2a5b" text-anchor="middle">K=8 — обучаемое компактное представление колонки, а не уровень давления.</text>
<text x="790" y="730" font-size="22" font-weight="400" fill="#5d6b82" text-anchor="middle">Это свойство Adaptive / Multimodal; Joint / Hydrostatic Mesh-8 не обязан проходить через K=8.</text>
<rect x="45" y="785" width="460" height="70" rx="18" fill="#f2ecff" stroke="#6f42c1" stroke-width="2"/>
<text x="275" y="829" font-size="23" font-weight="700" fill="#6f42c1" text-anchor="middle">Спутники: только Multimodal</text>
<rect x="570" y="785" width="460" height="70" rx="18" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="800" y="829" font-size="23" font-weight="700" fill="#1677d2" text-anchor="middle">Шаг прогноза: 3 ч</text>
<rect x="1095" y="785" width="440" height="70" rx="18" fill="#f7fafc" stroke="#bdd7ef" stroke-width="2"/>
<text x="1315" y="829" font-size="23" font-weight="700" fill="#0b2a5b" text-anchor="middle">Отдельные веса от Joint</text>
