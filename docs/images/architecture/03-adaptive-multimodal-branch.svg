<rect x="795" y="135" width="360" height="52" rx="14" fill="#1677d2" stroke="#1677d2" stroke-width="0"/>
<text x="813" y="171" class="w h2">3. AdaptiveProcessor</text>
<rect x="1180" y="135" width="395" height="52" rx="14" fill="#1677d2" stroke="#1677d2" stroke-width="0"/>
<text x="1198" y="171" class="w h2">4. Decode + output</text>
