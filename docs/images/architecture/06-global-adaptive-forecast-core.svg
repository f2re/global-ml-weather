<text x="390" y="547" font-size="23" fill="#0b2a5b">адаптация относится к активациям и сообщениям</text>
<circle cx="375" cy="577" r="4.5" fill="#0b2a5b"/>
<text x="390" y="584" font-size="23" fill="#0b2a5b">это не online retraining и не численный solver</text>
