<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="white"/>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#0b2a5b}.w{fill:white}.h1{font-size:47px;font-weight:700}.h2{font-size:28px;font-weight:700}.s{fill:#5d6b82}</style>
<text x="42" y="60" class="h1">8. Физика, постобработка и выдача</text>
<text x="44" y="98" class="s" font-size="28">разделяем активный canonical path, evaluation и пока не подключённые helpers</text>
<rect x="25" y="125" width="755" height="52" rx="14" fill="#0e9f8b" stroke="#0e9f8b" stroke-width="0"/>
<text x="43" y="161" class="w h2">Активно в canonical Joint / issuance</text>
<rect x="820" y="125" width="755" height="52" rx="14" fill="#1677d2" stroke="#1677d2" stroke-width="0"/>
<text x="838" y="161" class="w h2">Evaluation / экспериментальные helpers</text>
<rect x="45" y="205" width="340" height="150" rx="16" fill="#eafaf7" stroke="#0e9f8b" stroke-width="2"/>
<text x="63" y="239" font-size="24" font-weight="700" fill="#0e9f8b" text-anchor="start">Hydrostatic decoder</text>
<circle cx="69" cy="266" r="4" fill="#0e9f8b"/>
<text x="84" y="273" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">T &gt; 0; q &gt; 0</text>
<circle cx="69" cy="295" r="4" fill="#0e9f8b"/>
<text x="84" y="302" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">Φ: hydrostatic projection</text>
<rect x="415" y="205" width="340" height="150" rx="16" fill="#eafaf7" stroke="#0e9f8b" stroke-width="2"/>
<text x="433" y="239" font-size="24" font-weight="700" fill="#0e9f8b" text-anchor="start">Flow conditioning</text>
<circle cx="439" cy="266" r="4" fill="#0e9f8b"/>
<text x="454" y="273" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">wind + ∇Φ + Coriolis</text>
<circle cx="439" cy="295" r="4" fill="#0e9f8b"/>
<text x="454" y="302" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">θ-gated vertical mixing</text>
<rect x="45" y="390" width="340" height="150" rx="16" fill="#eafaf7" stroke="#0e9f8b" stroke-width="2"/>
<text x="63" y="424" font-size="24" font-weight="700" fill="#0e9f8b" text-anchor="start">Surface constraints</text>
<circle cx="69" cy="451" r="4" fill="#0e9f8b"/>
<text x="84" y="458" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">T &gt; 0; Td ≤ T</text>
<circle cx="69" cy="480" r="4" fill="#0e9f8b"/>
<text x="84" y="487" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">Ps &gt; 0; MSLP &gt; 0</text>
<rect x="415" y="390" width="340" height="150" rx="16" fill="#eafaf7" stroke="#0e9f8b" stroke-width="2"/>
<text x="433" y="424" font-size="24" font-weight="700" fill="#0e9f8b" text-anchor="start">Forecast physics</text>
<circle cx="439" cy="451" r="4" fill="#0e9f8b"/>
<text x="454" y="458" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">diagnostic omega</text>
<circle cx="439" cy="480" r="4" fill="#0e9f8b"/>
<text x="454" y="487" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">below-ground mask</text>
<circle cx="439" cy="509" r="4" fill="#0e9f8b"/>
<text x="454" y="516" font-size="20" font-weight="400" fill="#0e9f8b" text-anchor="start">NPZ / GRIB2 + SHA256</text>
<rect x="840" y="205" width="340" height="150" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="858" y="239" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Mass / tendency bounding</text>
<circle cx="864" cy="266" r="4" fill="#1677d2"/>
<text x="879" y="273" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">surface rollout evaluation</text>
<circle cx="864" cy="295" r="4" fill="#1677d2"/>
<text x="879" y="302" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">3-h tendency + mean-mass bounds</text>
