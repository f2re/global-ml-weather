<text x="1228" y="239" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Bias-aware loss helper</text>
<circle cx="1234" cy="266" r="4" fill="#1677d2"/>
<text x="1249" y="273" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">Huber + bias penalty</text>
