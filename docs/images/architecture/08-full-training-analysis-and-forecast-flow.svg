<text x="1249" y="302" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">sample confidence</text>
<rect x="840" y="390" width="340" height="150" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="858" y="424" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Terrain-anchored Φ</text>
<circle cx="864" cy="451" r="4" fill="#1677d2"/>
<text x="879" y="458" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">helper реализован</text>
<circle cx="864" cy="480" r="4" fill="#1677d2"/>
<text x="879" y="487" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">canonical decoder пока projection</text>
<rect x="1210" y="390" width="340" height="150" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="1228" y="424" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Climatology anomaly stepper</text>
<circle cx="1234" cy="451" r="4" fill="#1677d2"/>
<text x="1249" y="458" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">класс реализован</text>
<circle cx="1234" cy="480" r="4" fill="#1677d2"/>
<text x="1249" y="487" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">не в canonical Joint forward</text>
<rect x="840" y="575" width="710" height="150" rx="16" fill="#eaf5ff" stroke="#1677d2" stroke-width="2"/>
<text x="858" y="609" font-size="24" font-weight="700" fill="#1677d2" text-anchor="start">Station microclimate corrector</text>
<circle cx="864" cy="636" r="4" fill="#1677d2"/>
<text x="879" y="643" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">sub-grid station helper</text>
<circle cx="864" cy="665" r="4" fill="#1677d2"/>
<text x="879" y="672" font-size="20" font-weight="400" fill="#1677d2" text-anchor="start">не в JointObservationModel forward</text>
<rect x="45" y="585" width="710" height="140" rx="18" fill="#f7fafc" stroke="#bdd7ef" stroke-width="2"/>
<text x="400" y="625" font-size="26" font-weight="700" fill="#0b2a5b" text-anchor="middle">Issuance</text>
<circle cx="75" cy="658" r="4" fill="#0b2a5b"/>
<text x="90" y="665" font-size="20" font-weight="400" fill="#0b2a5b" text-anchor="start">37-level profile fields</text>
<circle cx="75" cy="687" r="4" fill="#0b2a5b"/>
<text x="90" y="694" font-size="20" font-weight="400" fill="#0b2a5b" text-anchor="start">station-native surface fields</text>
<circle cx="75" cy="716" r="4" fill="#0b2a5b"/>
<text x="90" y="723" font-size="20" font-weight="400" fill="#0b2a5b" text-anchor="start">inventory / provenance / telemetry</text>
<rect x="45" y="760" width="1510" height="90" rx="18" fill="#f7fafc" stroke="#bdd7ef" stroke-width="2"/>
<text x="800" y="800" font-size="25" font-weight="700" fill="#0b2a5b" text-anchor="middle">Статус важнее намерения: helper в коде ≠ автоматически включённый train/inference path.</text>
<text x="800" y="833" font-size="20" font-weight="400" fill="#5d6b82" text-anchor="middle">Схема фиксирует именно текущую интеграцию на main.</text>
</svg>